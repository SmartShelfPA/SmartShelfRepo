# Load NGROK_AUTHTOKEN from .env (copy .env.example to .env).
# Start tunnel: docker compose --profile tunnel up -d
# Public URL: open http://localhost:4040 (ngrok inspector) or check container logs.
#
# If you see "500" / "requested API version" on Windows: restart Docker Desktop,
# run `docker pull postgres:16-alpine`, and use the real project folder (not a symlink),
# e.g. `SmartShelfRepo` — avoid duplicate casing paths like `smartshelfrepo` → symlink.

name: smartshelf

services:
  db:
    image: postgres:16-alpine
    container_name: smartshelf-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartshelf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - smartshelf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartshelf"]
      interval: 5s
      timeout: 5s
      retries: 10

  aloc-db:
    image: mysql:8.0
    container_name: smartshelf-aloc-db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: aloc
      MYSQL_USER: aloc
      MYSQL_PASSWORD: aloc
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - smartshelf_aloc_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 25s

  aloc:
    build:
      context: ./aloc-endpoints
      dockerfile: Dockerfile
    container_name: smartshelf-aloc
    restart: unless-stopped
    depends_on:
      aloc-db:
        condition: service_healthy
    volumes:
      - ./aloc-endpoints:/var/www/html
    environment:
      DB_HOST: aloc-db
      DB_PORT: "3306"
      DB_DATABASE: aloc
      DB_USERNAME: aloc
      DB_PASSWORD: aloc
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000')===false?1:0);\""]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 240s

  quotes:
    image: hashicorp/http-echo:1.0.0
    container_name: smartshelf-quotes
    restart: unless-stopped
    command:
      - "-listen=:8080"
      - "-text={\"Quote\":\"The beautiful thing about learning is that no one can take it away from you.\",\"Author\":\"B.B. King\"}"
    ports:
      - "8080:8080"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartshelf-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      quotes:
        condition: service_started
      aloc:
        condition: service_healthy
    environment:
      POSTGRES_DB: smartshelf
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      QUOTES_API_URL: http://quotes:8080/
      DEBUG: "True"
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@smartshelf.app}
      # Dev only: API accepts requests without Bearer for N minutes after container start (0 = off).
      AUTH_FREE_FOR_MINUTES: ${AUTH_FREE_FOR_MINUTES:-0}
      AUTH_BYPASS_USER_ID: ${AUTH_BYPASS_USER_ID:-}
      # WAEC/JAMB practice — local ALOC in Docker (override for hosted questions.aloc.com.ng).
      ALOC_API_BASE_URL: ${ALOC_API_BASE_URL:-http://aloc:8000/api/v2}
      ALOC_ACCESS_TOKEN: ${ALOC_ACCESS_TOKEN:-smartshelf-dev-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BUNDLED_IGCSE_EPUB_DIR: /app/bundled-igcse/epubs
      BUNDLED_IGCSE_MANIFEST: /app/bundled-igcse/manifest.json
    ports:
      - "8000:8000"
    volumes:
      - ./backend/smartshelfbackend:/app/smartshelfbackend
      - ./backend/vendor:/app/vendor
      - ./bundled-igcse:/app/bundled-igcse:ro

  ngrok:
    image: ngrok/ngrok:latest
    container_name: smartshelf-ngrok
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "backend:8000"
    ports:
      - "4040:4040"

volumes:
  smartshelf_postgres_data:
  smartshelf_aloc_mysql_data:
