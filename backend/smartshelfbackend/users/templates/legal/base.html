<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}SmartShelf{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.6; color: #1a1a1a; max-width: 720px; margin: 0 auto; padding: 24px 20px 48px; }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 2rem; }
    h2 { font-size: 1.1rem; margin-top: 1.75rem; margin-bottom: 0.5rem; }
    p, li { font-size: 0.95rem; }
    ul { padding-left: 1.25rem; }
    a { color: #0a7a2f; }
    footer { margin-top: 2.5rem; font-size: 0.85rem; color: #666; border-top: 1px solid #e5e5e5; padding-top: 1rem; }
  </style>
</head>
<body>
  <h1>{% block page_title %}{% endblock %}</h1>
  <p class="meta">{% block meta %}Last updated: June 2024 · Version 2024-06{% endblock %}</p>
  {% block content %}{% endblock %}
  <footer>
    SmartShelf ·
    <a href="mailto:info@smartshelflearn.com">info@smartshelflearn.com</a> ·
    <a href="/privacy/">Privacy</a> ·
    <a href="/terms/">Terms</a>
  </footer>
</body>
</html>
